name: Validate Vintage Tape

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins-native/**'
      - '.github/workflows/vintage-tape-validation.yml'
  push:
    paths:
      - 'plugins-native/**'
      - '.github/workflows/vintage-tape-validation.yml'

jobs:
  macos:
    name: Build VST3 and AU and check signal flow
    runs-on: macos-15-intel
    env:
      # JUCE 7 bootstraps juceaide in a nested CMake invocation. The environment
      # also sets its deployment target, not just the plugin targets below.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugins-native -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DBUILD_TESTING=ON -DVIRGO_BUILD_STUDIOS=OFF
      - name: Build both plugin formats and headless tests
        run: cmake --build build --config Release --target VAVintageTape_VST3 VAVintageTape_AU VAVintageTapeTests --parallel 2
      - name: Run headless signal-flow tests
        run: ctest --test-dir build -C Release --output-on-failure -R '^VAVintageTapeSignalTests$'
      - name: Retain plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: VintageTape-macOS
          path: |
            build/mastering/vintage-tape/VAVintageTape_artefacts/Release/VST3/
            build/mastering/vintage-tape/VAVintageTape_artefacts/Release/AU/
          if-no-files-found: error

