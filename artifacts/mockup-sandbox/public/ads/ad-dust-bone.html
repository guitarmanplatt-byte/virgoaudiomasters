<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<title>Ad – Dust & Bone</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #1a0f06;
  }
  .ad {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  .hero-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
  }
  /* Heavy bottom gradient so text is always legible */
  .gradient {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10,5,0,0.45) 0%,
      rgba(10,5,0,0.1) 30%,
      rgba(10,5,0,0.1) 45%,
      rgba(10,5,0,0.85) 75%,
      rgba(10,5,0,0.97) 100%
    );
  }
  .content {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 6vh 7vw 5vh;
    display: flex;
    flex-direction: column;
    gap: 1.4vh;
  }
  .label {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-size: 2.2vw;
    color: #c8843a;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .artist {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 900;
    font-size: 7.5vw;
    line-height: 1.0;
    color: #f5e8d0;
    letter-spacing: -0.01em;
  }
  .album {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 2.8vw;
    line-height: 1.3;
    color: #c4a87a;
    max-width: 70vw;
    margin-top: 0.5vh;
  }
  .listen {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-size: 1.9vw;
    color: rgba(196,168,122,0.65);
    margin-top: 1.5vh;
    letter-spacing: 0.08em;
  }
  /* Top-left logo area */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 4vh 7vw;
    display: flex;
    align-items: center;
  }
  .logo-mark {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 2.4vw;
    color: rgba(245,232,208,0.9);
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="ad">
  <img class="hero-img" src="/__mockup/images/ad-dust-bone.jpg" alt="Desolate Americana road">
  <div class="gradient"></div>
  <div class="top-bar">
    <span class="logo-mark">CT&BJ</span>
  </div>
  <div class="content">
    <span class="label">New Album</span>
    <div class="artist">Collin Taylor<br>&amp; the Blues Jets</div>
    <div class="album">Boars Head, Torn Eyes,<br>And The Cluck Of Sick Gore</div>
    <div class="listen">Listen Now on YouTube</div>
  </div>
</div>
</body>
</html>
